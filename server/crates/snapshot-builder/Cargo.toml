[package]
name = "snapshot-builder"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
artifact-contract = { path = "../artifact-contract" }
authz = { path = "../authz" }
bigdecimal = "0.4"
canonical-log = { path = "../canonical-log" }
cdc-ingest = { path = "../cdc-ingest" }
chrono = { version = "0.4", default-features = false, features = ["std"] }
direct-columnar = { path = "../direct-columnar" }
futures-util = "0.3"
hex = "0.4"
postgres-types = "0.2.11"
pgoutput-decoder = { path = "../pgoutput-decoder" }
postgres = "0.19.14"
postgres-connect = { path = "../postgres-connect" }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.10.9"
snapshot-coordinator = { path = "../snapshot-coordinator" }
source-control = { path = "../source-control" }
sync-protocol = { path = "../sync-protocol" }
sync-types = { path = "../sync-types" }
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt", "sync"] }
tokio-postgres = { version = "0.7.18", features = ["with-chrono-0_4", "with-uuid-1"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
