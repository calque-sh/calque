[package]
name = "artifact-catalog"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
background-thread = { path = "../background-thread" }
artifact-contract = { path = "../artifact-contract" }
blob-store = { path = "../blob-store" }
rusqlite = { version = "0.40.1", default-features = false, features = ["bundled"] }
serde_json = "1"
sync-types = { path = "../sync-types" }
thiserror = "1"
uuid = { version = "1.23.0", features = ["v4"] }

[dev-dependencies]
async-trait = "0.1.89"
sha2 = "0.10.9"
tempfile = "3"
tokio = { version = "1.52.0", features = ["io-util", "macros", "rt"] }

[lints]
workspace = true
