[package]
name = "background-thread"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
tracing = "0.1.44"

[target.'cfg(target_os = "macos")'.dependencies]
# The two calls this crate makes on macOS, which set and read the calling
# thread's QoS class, have no safe binding.
libc = "0.2.186"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.4", default-features = false, features = ["std", "process", "thread"] }

# The workspace's only lint forbids unsafe code, which no item can then
# allow. This crate denies it instead, and allows it on the two macOS calls
# alone.
[lints.rust]
unsafe_code = "deny"
