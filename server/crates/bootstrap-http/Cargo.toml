[package]
name = "bootstrap-http"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
artifact-contract = { path = "../artifact-contract" }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
bootstrap-api = { path = "../bootstrap-api" }
http-headers = { path = "../http-headers" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sync-types = { path = "../sync-types" }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.52.3", features = ["macros", "rt"] }
tower = { version = "0.5.3", features = ["util"] }

[lints]
workspace = true
