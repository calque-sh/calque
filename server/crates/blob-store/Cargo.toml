[package]
name = "blob-store"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1.89"
aws-sdk-s3 = { version = "=1.138.0", default-features = false, features = ["default-https-client", "http-1x", "rt-tokio", "rustls"] }
hex = "0.4.3"
# 0.11 hashes with the ARMv8 SHA-256 instructions, detected at run time;
# 0.10 without `asm` hashes in software, and every artifact byte is hashed
# several times on the preparation path. 0.11 is already in Cargo.lock
# through aws-sdk-s3. `hex` formats its digests, because 0.11's do not
# implement `LowerHex`.
sha2 = { version = "0.11.0", default-features = false }
sync-types = { path = "../sync-types" }
thiserror = "1"
tokio = { version = "1.52.0", features = ["fs", "io-util", "macros", "rt", "sync", "time"] }
uuid = { version = "1.23.0", features = ["v4"] }

[dev-dependencies]
# Checks that 0.11's digests equal 0.10.9's, so object names do not depend on
# the hasher version.
sha2_010 = { package = "sha2", version = "0.10.9" }
tempfile = "3"

[lints]
workspace = true
