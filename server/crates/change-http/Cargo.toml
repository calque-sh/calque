[package]
name = "change-http"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
change-api = { path = "../change-api" }
futures-util = "0.3"
# A one-batch response is a body of known length over the batch's own buffers.
http-body = "1.0.1"
http-headers = { path = "../http-headers" }
prost = "0.14.4"
sync-protocol = { path = "../sync-protocol" }
sync-types = { path = "../sync-types" }
tokio = { version = "1.52.3", features = ["rt", "sync"] }
tracing = "0.1.44"
zstd = { version = "0.13.3", default-features = false }

[dev-dependencies]
authz = { path = "../authz" }
canonical-log = { path = "../canonical-log", features = ["test-support"] }
source-control = { path = "../source-control" }
sync-protocol = { path = "../sync-protocol", features = ["test-support"] }
tempfile = "3"
tokio = { version = "1.52.3", features = ["macros", "rt"] }
tower = { version = "0.5.3", features = ["util"] }

[lints]
workspace = true
