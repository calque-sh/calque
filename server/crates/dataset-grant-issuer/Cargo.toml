[package]
name = "dataset-grant-issuer"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The development grant minter. It lives inside the issuer so no server build
# can link grant minting; `scripts/verify-grant-issuer-linkage.ts` refuses a
# normal dependency edge on this crate.
[[bin]]
name = "calque-dev-grant"
path = "src/bin/calque-dev-grant.rs"

[dependencies]
base64 = "0.22"
# `calque-dev-grant`'s argument parser, the version the `calque` binary uses.
clap = { version = "4.6.2", features = ["derive"] }
dataset-grant = { path = "../dataset-grant" }
ring = "0.17.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Signs exactly the revocation-barrier bytes `sync-protocol` verifies.
sync-protocol = { path = "../sync-protocol" }
thiserror = "1"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
